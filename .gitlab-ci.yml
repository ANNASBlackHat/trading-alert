stages:
  - build
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE/trading-bot
  IMAGE_TAG: $CI_COMMIT_REF_SLUG
  CONTAINER_NAME: "trading-alert"

# 1. Build the image using GitLab's Public Runners
build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker push $IMAGE_NAME:$IMAGE_TAG
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /#nobuild/'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

# 2. Pull and Run on your VPS
deploy_to_vps:
  stage: deploy
  image: docker/compose:1.25.5
  tags:
    - annas-dev
  script:
    - echo "Logging into registry on VPS... "
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    
    - echo "Pulling latest image... $IMAGE_NAME:$IMAGE_TAG"
    - docker pull $IMAGE_NAME:$IMAGE_TAG
    
    - echo "Stopping existing container..."
    - docker stop $CONTAINER_NAME || true
    - docker rm $CONTAINER_NAME || true
    
    - echo "Creating config.yaml from CI variable..."
    - echo "$CONFIG_YAML" > config.yaml
    
    - echo "Starting new container..."
    - docker run -d --name $CONTAINER_NAME --restart unless-stopped -v /root/trading-alert/config.yaml:/app/config.yaml -p 16261:8080 $IMAGE_NAME:$IMAGE_TAG
    - docker container exec $CONTAINER_NAME sh -c "echo '$CONFIG_YAML' > /app/config.yaml"
    - docker container restart $CONTAINER_NAME
    
    - echo "Deployment successful!"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
