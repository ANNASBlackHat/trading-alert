stages:
  - build
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE/trading-bot
  IMAGE_TAG: $CI_COMMIT_REF_SLUG
  CONTAINER_NAME: "trading-alert"
  MCP_CONTAINER_NAME: "trading-mcp"
  MCP_PORT: "8090"

# 1. Build the image using GitLab's Public Runners
build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker push $IMAGE_NAME:$IMAGE_TAG
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /#nobuild/'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

# 2. Pull and Run the trading-bot on your VPS
deploy_to_vps:
  stage: deploy
  image: docker/compose:1.25.5
  tags:
    - annas-dev
  script:
    - echo "Logging into registry on VPS..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

    - echo "Pulling latest image... $IMAGE_NAME:$IMAGE_TAG"
    - docker pull $IMAGE_NAME:$IMAGE_TAG

    - echo "Stopping existing container..."
    - docker stop $CONTAINER_NAME || true
    - docker rm $CONTAINER_NAME || true

    - echo "Creating config.yaml from CI variable..."
    # The job runs on the runner, but the container's volume mount points to
    # /root/trading-alert/config.yaml on the VPS host. Write the config to the
    # mounted path (not the runner's cwd) BEFORE the container starts, so the
    # first boot already finds it.
    - mkdir -p /root/trading-alert
    - printf '%s' "$CONFIG_YAML" > /root/trading-alert/config.yaml

    - echo "Starting new container..."
    - docker run -d --name $CONTAINER_NAME --restart unless-stopped -v /root/trading-alert/data:/app/data -v /root/trading-alert/config.yaml:/app/config.yaml -p 16261:8080 $IMAGE_NAME:$IMAGE_TAG

    - echo "Deployment successful!"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

# 3. Pull and Run the trading-mcp (streamable-HTTP MCP server) on your VPS
deploy_mcp:
  stage: deploy
  image: docker/compose:1.25.5
  tags:
    - annas-dev
  # The MCP server needs the MongoDB connection string to serve the
  # btc_agent / stocks_agent databases. Set MONGODB_URI in the GitLab CI/CD
  # variable settings (masked + protected) before enabling this job.
  script:
    - test -n "$MONGODB_URI" || (echo "MONGODB_URI CI variable is not set; skipping MCP deploy" && exit 0)
    - echo "Logging into registry on VPS..."
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

    - echo "Pulling latest image... $IMAGE_NAME:$IMAGE_TAG"
    - docker pull $IMAGE_NAME:$IMAGE_TAG

    - echo "Stopping existing MCP container..."
    - docker stop $MCP_CONTAINER_NAME || true
    - docker rm $MCP_CONTAINER_NAME || true

    - echo "Starting MCP container on port $MCP_PORT..."
    - >
      docker run -d --name $MCP_CONTAINER_NAME --restart unless-stopped
      --entrypoint /app/trading-mcp
      -e MCP_TRANSPORT=http
      -e MCP_HTTP_ADDR=":$MCP_PORT"
      -e MONGODB_URI="$MONGODB_URI"
      -p $MCP_PORT:$MCP_PORT
      $IMAGE_NAME:$IMAGE_TAG
    - echo "MCP server listening on http://<vps>:$MCP_PORT"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
